name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Detect changed services
        id: detect
        run: |
          set -euo pipefail
          ROOT=$(git rev-list --max-parents=0 HEAD)

          BE_TAG=$(git describe --tags --match 'backend/v*' --abbrev=0 2>/dev/null || echo "")
          BE_FILES=$(git diff --name-only "${BE_TAG:-$ROOT}" HEAD)

          FE_TAG=$(git describe --tags --match 'frontend/v*' --abbrev=0 2>/dev/null || echo "")
          FE_FILES=$(git diff --name-only "${FE_TAG:-$ROOT}" HEAD)

          echo "be=$(echo "$BE_FILES" | grep -q '^backend/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "fe=$(echo "$FE_FILES" | grep -q '^frontend/' && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Release backend
        if: steps.detect.outputs.be == 'true'
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('backend/pyproject.toml','rb'))['project']['version'])")
          TAG="backend/v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/changelog-release.py "$VERSION" backend > /tmp/release-body.md
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-body.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Release frontend
        if: steps.detect.outputs.fe == 'true'
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' frontend/package.json)
          TAG="frontend/v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/changelog-release.py "$VERSION" frontend > /tmp/release-body.md
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-body.md
        env:
          GH_TOKEN: ${{ github.token }}