name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Detect changed services
        id: detect
        run: |
          FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD || true)
          if [[ -n "$FILES" ]] && echo "$FILES" | grep -q '^backend/'; then echo "be=true" >> $GITHUB_OUTPUT; else echo "be=false" >> $GITHUB_OUTPUT; fi
          if [[ -n "$FILES" ]] && echo "$FILES" | grep -q '^frontend/'; then echo "fe=true" >> $GITHUB_OUTPUT; else echo "fe=false" >> $GITHUB_OUTPUT; fi

      - name: Release backend
        if: steps.detect.outputs.be == 'true'
        run: |
          VERSION=$(grep -oP 'version\s*=\s*"\K[^"]+' backend/pyproject.toml | head -1)
          TAG="backend/v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/changelog-release.py "$VERSION" backend > /tmp/release-body.md
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-body.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Release frontend
        if: steps.detect.outputs.fe == 'true'
        run: |
          VERSION=$(grep -oP '"version"\s*:\s*"\K[^"]+' frontend/package.json | head -1)
          TAG="frontend/v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/changelog-release.py "$VERSION" frontend > /tmp/release-body.md
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-body.md
        env:
          GH_TOKEN: ${{ github.token }}
