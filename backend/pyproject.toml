[project]
name = "personal-fin-hub"
version = "0.19.0"
description = "Personal Finance & Investment Ledger"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.10.0",
    "fastapi",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "python-json-logger>=4.1.0",
    "uvicorn",
]

[tool.uv]
dev-dependencies = [
    "mypy>=1.0",
    "pre-commit>=4.0",
    "pytest-cov>=7.1.0",
    "pytest>=9.1.1",
    "ruff>=0.11.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "SIM102", # nested if — readable as-is in this codebase
    "SIM105", # contextlib.suppress — try/except/pass is clearer here
    "SIM108", # ternary — if/else is clearer in these contexts
]

[tool.ruff.lint.isort]
known-first-party = ["models", "services", "db", "routes"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_return_any = false
warn_unused_ignores = false
exclude = [
    "tests/test_models.py",
    "tests/test_schedules.py",
]
