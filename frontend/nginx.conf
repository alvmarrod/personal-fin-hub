server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Backend can legitimately take a while: Market API retries/timeouts
        # (30s x 3 attempts + backoff) and batch syncs run in the background.
        # Replace the 60s defaults so long requests aren't cut with a 504.
        proxy_connect_timeout 5s;   # local container network — connect is ~instant
        proxy_send_timeout    300s; # client-request body read (small JSON)
        proxy_read_timeout    300s; # first response byte from backend
    }
}
