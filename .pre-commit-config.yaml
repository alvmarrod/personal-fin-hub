repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: force-lf
        # Convert even uniformly-CRLF files to LF. mixed-line-ending only fixes
        # files whose endings are MIXED (LF and CRLF together); a file that is
        # entirely CRLF is left unchanged. This hook forces every staged text
        # file to LF.
        name: force LF line endings
        entry: bash scripts/fix-line-endings.sh
        language: system
        types: [text]
        pass_filenames: true

      - id: check-line-endings
        # Backstop for the working-tree hooks: force-lf normalizes on-disk
        # files, but `.gitattributes eol=lf` masks CRLF on checkout, so a CRLF
        # blob can hide in the index. Scan the canonical index/HEAD content for
        # carriage returns and fail if any are about to be committed.
        name: check committed line endings
        entry: bash scripts/check-line-endings.sh --staged
        language: system
        always_run: true
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd backend && uv run ruff check'
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && uv run ruff format'
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && uv run mypy .'
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: bash -c 'cd backend && uv run python -m pytest tests/ -q --tb=short'
        language: system
        types: [python]
        pass_filenames: false

      - id: svelte-check
        name: svelte check
        entry: bash -c 'cd frontend && bunx svelte-check'
        language: system
        files: ^frontend/.*\.(svelte|js|ts|svelte\.ts)$
        pass_filenames: false

      - id: validate-i18n
        name: validate i18n keys
        entry: bash -c 'cd frontend && bun run validate-i18n'
        language: system
        files: ^frontend/.*\.(svelte|js|ts|svelte\.ts)$
        pass_filenames: false

      - id: markdownlint
        name: markdownlint
        entry: docker run --rm -v .:/work -w /work ghcr.io/igorshubovych/markdownlint-cli:latest markdownlint --fix
        language: system
        types: [markdown]
        pass_filenames: true

      - id: commit-msg
        name: conventional commits
        entry: python3 scripts/commit-msg-check.py
        language: system
        stages: [commit-msg]
        pass_filenames: true
        always_run: true
