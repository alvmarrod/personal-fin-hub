repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd backend && uv run ruff check'
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && uv run ruff format'
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && uv run mypy .'
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: bash -c 'cd backend && uv run python -m pytest tests/ -q --tb=short'
        language: system
        types: [python]
        pass_filenames: false

      - id: svelte-check
        name: svelte check
        entry: bash -c 'cd frontend && bunx svelte-check'
        language: system
        files: ^frontend/.*\.(svelte|js|ts|svelte\.ts)$
        pass_filenames: false

      - id: validate-i18n
        name: validate i18n keys
        entry: bash -c 'cd frontend && bun run validate-i18n'
        language: system
        files: ^frontend/.*\.(svelte|js|ts|svelte\.ts)$
        pass_filenames: false

      - id: markdownlint
        name: markdownlint
        entry: docker run --rm -v .:/work -w /work ghcr.io/igorshubovych/markdownlint-cli:latest markdownlint --fix
        language: system
        types: [markdown]
        pass_filenames: true
